[project]
name = "animator"
version = "0.1.0"
description = "3D Animation rendering service using Blender"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.1,<0.105.0",
    "uvicorn[standard]>=0.24.0,<0.25.0",
    "google-cloud-storage>=2.18.0,<3.0.0",
    "setuptools>=68.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []