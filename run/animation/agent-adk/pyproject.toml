[project]
name = "animation-adk-agent"
version = "0.1.0"
description = "ADK-based Animation Generation Agent"
authors = [
    {name = "Animation Team"}
]
requires-python = ">=3.10"
dependencies = [
    "google-adk[eval]",
    "google-cloud-aiplatform",
    "google-cloud-storage",
    "google-genai",
    "pydantic",
    "python-dotenv",
    "requests",
    "google-auth",
    "fastapi",
    "uvicorn"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]