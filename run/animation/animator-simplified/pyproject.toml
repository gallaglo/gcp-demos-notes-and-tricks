[project]
name = "simplified-animator-service"
version = "0.1.0"
description = "Simplified Blender Animation Service (GCS logic removed for ADK migration)"
authors = [
    {name = "Animation Team"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]